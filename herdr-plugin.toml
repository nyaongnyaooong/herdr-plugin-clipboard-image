id = "clipboard-image"
name = "Clipboard Image"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Pastes clipboard images or text into the focused Herdr pane."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "paste"
title = "Paste clipboard image"
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-STA", "-ExecutionPolicy", "Bypass", "-File", "scripts/paste-image.ps1"]
platforms = ["windows"]

[[actions]]
id = "paste-linux"
title = "Paste Linux clipboard image"
command = ["python3", "scripts/paste-linux.py"]
platforms = ["linux"]

[[actions]]
id = "paste-macos"
title = "Paste macOS clipboard"
command = ["python3", "scripts/paste_macos.py"]
platforms = ["macos"]

[[startup]]
command = ["C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/paste-watch.ps1"]
platforms = ["windows"]

[[startup]]
command = ["sh", "scripts/paste-watch-macos.sh"]
platforms = ["macos"]

[[build]]
command = ["sh", "scripts/build-macos.sh"]
platforms = ["macos"]
